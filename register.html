<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendEater | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="auth-shell auth-form-page">
      <a class="back-exit" href="auth.html" aria-label="Back to home">←<span>Back / Exit</span></a>

      <div class="auth-toolbar" aria-label="Authentication tabs">
        <a class="tab" href="login.html">Login</a>
        <a class="tab active" href="register.html">Register</a>
      </div>

      <div class="auth-card single-form-card">
        <div class="auth-header center-header">
          <p class="eyebrow">Create account</p>
          <h2>Register with TrendEater</h2>
          <p class="helper-text">Firebase Auth will be connected later.</p>
        </div>

        <form class="auth-form" id="registerForm">
          <div class="two-col">
            <div class="field-group">
              <label for="firstName">First name</label>
              <input id="firstName" type="text" placeholder="First name" required />
            </div>

            <div class="field-group">
              <label for="lastName">Last name</label>
              <input id="lastName" type="text" placeholder="Last name" required />
            </div>
          </div>

          <div class="field-group">
            <label for="registerEmail">Email address</label>
            <input id="registerEmail" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field-group">
            <label for="userName">Username</label>
            <input id="userName" type="text" placeholder="Choose a username" required />
          </div>

          <div class="two-col">
            <div class="field-group">
              <label for="registerPassword">Password</label>
              <input id="registerPassword" type="password" placeholder="Create password" required />
            </div>

            <div class="field-group">
              <label for="confirmPassword">Confirm</label>
              <input id="confirmPassword" type="password" placeholder="Repeat password" required />
            </div>
          </div>

          <label class="checkbox-wrap terms">
            <input type="checkbox" required />
            <span>I agree to the community terms and conditions</span>
          </label>

          <button type="submit" class="primary-btn">Create account</button>
        </form>

        <div id="authMessage" class="status-message" aria-live="polite"></div>
      </div>
    </div>

    <script>
      const messageBox = document.getElementById('authMessage');

      window.addEventListener('load', () => {
        initializeFirebase();
      });

      document.getElementById('registerForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const username = document.getElementById('userName').value.trim();
        const password = document.getElementById('registerPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!firstName || !lastName || !email || !username) {
          messageBox.textContent = 'Please complete all required fields.';
          messageBox.classList.add('show');
          return;
        }

        if (password !== confirmPassword) {
          messageBox.textContent = 'Passwords do not match. Please try again.';
          messageBox.classList.add('show');
          return;
        }

        if (!window.firebaseReady.initialized) {
          messageBox.textContent = 'Firebase is not initialized yet. Add your project config in firebase-config.js.';
          messageBox.classList.add('show');
          return;
        }

        try {
          const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
          const user = userCredential.user;

          if (user) {
            await user.updateProfile({
              displayName: `${firstName} ${lastName}`
            });
          }

          messageBox.textContent = 'Registration ready for Firebase auth. Your user account can be created here.';
          messageBox.classList.add('show');
        } catch (error) {
          messageBox.textContent = error.message;
          messageBox.classList.add('show');
        }
      });
    </script>
  </body>
</html>
