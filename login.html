<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendEater | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="auth-shell auth-form-page">
      <a class="back-exit" href="auth.html" aria-label="Back to home">←<span>Back / Exit</span></a>

      <div class="auth-toolbar" aria-label="Authentication tabs">
        <a class="tab active" href="login.html">Login</a>
        <a class="tab" href="register.html">Register</a>
      </div>

      <div class="auth-card single-form-card">
        <div class="auth-header center-header">
          <p class="eyebrow">Welcome back</p>
          <h2>TrendEater</h2>
          <p class="helper-text">Firebase Auth will be connected later.</p>
        </div>

        <form class="auth-form" id="loginForm">
          <div class="field-group">
            <label for="loginEmail">Email address</label>
            <input id="loginEmail" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="Enter your password" required />
          </div>

          <div class="options-row">
            <label class="checkbox-wrap">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#" class="inline-link">Forgot password?</a>
          </div>

          <button type="submit" class="primary-btn">Login to community</button>
        </form>

        <div id="authMessage" class="status-message" aria-live="polite"></div>
      </div>
    </div>

    <script>
      const messageBox = document.getElementById('authMessage');

      window.addEventListener('load', () => {
        initializeFirebase();
      });

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
          messageBox.textContent = 'Please fill in both email and password.';
          messageBox.classList.add('show');
          return;
        }

        if (!window.firebaseReady.initialized) {
          messageBox.textContent = 'Firebase is not initialized yet. Add your project config in firebase-config.js.';
          messageBox.classList.add('show');
          return;
        }

        try {
          await firebase.auth().signInWithEmailAndPassword(email, password);
          window.location.href = 'dashboard.html';
        } catch (error) {
          messageBox.textContent = error.message;
          messageBox.classList.add('show');
        }
      });
    </script>
  </body>
</html>
