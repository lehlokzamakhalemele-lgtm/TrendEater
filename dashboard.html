<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendEater | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="video-page">
      <a class="back-exit" href="auth.html" aria-label="Back to home">&#8592;<span>Back / Exit</span></a>
      <section class="video-library" aria-labelledby="videoLibraryTitle">
        <div class="video-library-header">
          <div>
            <p class="eyebrow">TrendEater library</p>
            <h1 id="videoLibraryTitle">Videos</h1>
          </div>
          <div id="ownerControls" class="owner-controls" hidden>
            <label class="add-video-button" for="videoPicker" title="Add a video">+</label>
            <input id="videoPicker" type="file" accept="video/*" multiple hidden />
          </div>
        </div>
        <p id="libraryMessage" class="helper-text">Loading videos...</p>
        <div id="videoGrid" class="video-grid"></div>
      </section>
    </main>

    <script>
      const videoGrid = document.getElementById('videoGrid');
      const libraryMessage = document.getElementById('libraryMessage');
      const ownerControls = document.getElementById('ownerControls');
      const videoPicker = document.getElementById('videoPicker');

      function renderVideo(fileName, url) {
        const videoCard = document.createElement('article');
        videoCard.className = 'video-card';
        videoCard.innerHTML = `<video controls preload="metadata" src="${url}"></video><p>${fileName}</p>`;
        videoGrid.appendChild(videoCard);
      }

      async function loadVideos() {
        const storageRef = firebase.storage().ref('videos');
        const result = await storageRef.listAll();

        if (!result.items.length) {
          libraryMessage.textContent = 'No videos have been added yet.';
          return;
        }

        libraryMessage.hidden = true;
        for (const item of result.items) {
          renderVideo(item.name, await item.getDownloadURL());
        }
      }

      videoPicker.addEventListener('change', async () => {
        const files = Array.from(videoPicker.files);
        if (!files.length) return;

        libraryMessage.hidden = false;
        libraryMessage.textContent = 'Uploading videos...';
        for (const file of files) {
          await firebase.storage().ref(`videos/${file.name}`).put(file);
        }
        videoGrid.replaceChildren();
        await loadVideos();
        videoPicker.value = '';
      });

      window.addEventListener('load', async () => {
        initializeFirebase();
        firebase.auth().onAuthStateChanged(async (user) => {
          if (!user) {
            window.location.href = 'login.html';
            return;
          }

          if (user.email === window.firebaseOwnerEmail) {
            ownerControls.hidden = false;
          }

          try {
            await loadVideos();
          } catch (error) {
            libraryMessage.textContent = 'Videos could not be loaded. Check Firebase Storage rules.';
            console.error(error);
          }
        });
      });
    </script>
  </body>
</html>
