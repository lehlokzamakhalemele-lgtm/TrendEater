<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendEater | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="video-page">
      <a class="back-exit" href="auth.html" aria-label="Back to home">&#8592;<span>Back / Exit</span></a>
      <section class="website-links-box" aria-labelledby="websiteLinksTitle">
        <p class="eyebrow">Quick links</p>
        <h2 id="websiteLinksTitle">Websites</h2>
        <textarea id="websiteLinksInput" aria-label="Website links" placeholder="Type one website link per line..."></textarea>
        <div id="websiteLinksList" class="website-links-list"></div>
      </section>

      <section class="video-library" aria-labelledby="videoLibraryTitle">
        <div class="video-library-header">
          <div>
            <p class="eyebrow">TrendEater library</p>
            <h1 id="videoLibraryTitle">Videos</h1>
          </div>
        </div>
        <p id="libraryMessage" class="helper-text">Loading videos...</p>
        <div id="videoGrid" class="video-grid"></div>
      </section>
    </main>

    <script>
      const videoGrid = document.getElementById('videoGrid');
      const libraryMessage = document.getElementById('libraryMessage');
      const websiteLinksInput = document.getElementById('websiteLinksInput');
      const websiteLinksList = document.getElementById('websiteLinksList');

      function renderVideo(fileName, url) {
        const videoCard = document.createElement('article');
        videoCard.className = 'video-card';
        videoCard.innerHTML = `<video controls preload="metadata" src="${url}"></video><p>${fileName}</p>`;
        videoGrid.appendChild(videoCard);
      }

      async function loadVideos() {
        const storageRef = firebase.storage().ref('videos');
        const result = await storageRef.listAll();

        if (!result.items.length) {
          libraryMessage.textContent = 'No videos have been added yet.';
          return;
        }

        libraryMessage.hidden = true;
        for (const item of result.items) {
          renderVideo(item.name, await item.getDownloadURL());
        }
      }

      function renderWebsiteLinks() {
        websiteLinksList.replaceChildren();
        const links = websiteLinksInput.value.split('\n').map((link) => link.trim()).filter(Boolean);

        for (const link of links) {
          const url = /^https?:\/\//i.test(link) ? link : `https://${link}`;
          try {
            const parsedUrl = new URL(url);
            const anchor = document.createElement('a');
            anchor.href = parsedUrl.href;
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
            anchor.textContent = link;
            websiteLinksList.appendChild(anchor);
          } catch {
            const invalidLink = document.createElement('span');
            invalidLink.textContent = link;
            websiteLinksList.appendChild(invalidLink);
          }
        }

        localStorage.setItem('trendEaterWebsiteLinks', websiteLinksInput.value);
      }

      websiteLinksInput.value = localStorage.getItem('trendEaterWebsiteLinks') || '';
      websiteLinksInput.addEventListener('input', renderWebsiteLinks);
      renderWebsiteLinks();

      window.addEventListener('load', async () => {
        initializeFirebase();
        firebase.auth().onAuthStateChanged(async (user) => {
          if (!user) {
            window.location.href = 'login.html';
            return;
          }

          try {
            await loadVideos();
          } catch (error) {
            libraryMessage.textContent = 'Videos could not be loaded. Check Firebase Storage rules.';
            console.error(error);
          }
        });
      });
    </script>
  </body>
</html>
